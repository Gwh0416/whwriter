version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: whwriter-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: whwriter123
      MYSQL_DATABASE: whwriter
      MYSQL_USER: whwriter
      MYSQL_PASSWORD: whwriter123
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
