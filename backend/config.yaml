# whwriter 配置文件
# 环境变量会覆盖此文件中的值

app:
  mode: dev          # dev | prod
  host: "0.0.0.0"
  port: 8080

sqlite:
  path: "data/whwriter.db"

browser:
  # 用于带本机浏览器验证码/登录态抓取番茄章节正文。
  auto_launch: true
  chrome_app_name: "Google Chrome"
  user_data_dir: "$HOME/.whwriter-chrome"
  cdp_url: "http://127.0.0.1:9222"
  chapter_fetch_timeout_seconds: 120

radar:
  # 第三方番茄章节正文接口。支持 {item_id} 占位符，失效后可替换。
  fanqie_content_api_url: "http://101.35.133.34:5000/api/raw_full?item_id={item_id}"
  fanqie_content_api_timeout_seconds: 8

llm:
  default_timeout_seconds: 600
  planner_timeout_seconds: 600
  writer_timeout_seconds: 600
  settler_timeout_seconds: 600
  auditor_timeout_seconds: 600
  reviser_timeout_seconds: 600
